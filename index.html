<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshita Modi | Cybersecurity SME</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: 10%;
            left: 20%;
            z-index: 0;
            filter: blur(40px);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 550px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-badge {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 1.8rem;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        /* Details List */
        .details-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 28px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .detail-label {
            color: var(--text-muted);
        }

        .detail-value {
            color: var(--text-main);
            font-weight: 600;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Assignments Section */
        .assignments-section h2 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .assignment-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background-color: #1a2234;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .assignment-btn:hover {
            border-color: var(--accent-cyan);
            background-color: #222d44;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.15);
        }

        .assignment-btn .icon {
            color: var(--accent-cyan);
            transition: transform 0.25s ease;
        }

        .assignment-btn:hover .icon {
            transform: translateX(4px);
        }

        /* Footer */
        footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        #live-clock {
            font-family: monospace;
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Header Profile -->
        <header class="profile-header">
            <div class="avatar-badge">AM</div>
            <h1>Akshita Modi</h1>
            <div class="subtitle">Subject Matter Expert</div>
        </header>

        <!-- Profile Details -->
        <section class="details-grid">
            <div class="detail-item">
                <span class="detail-label">Institution</span>
                <span class="detail-value">CityU (City University)</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Specialization</span>
                <span class="detail-value">Cybersecurity</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Status</span>
                <span class="detail-value">
                    <span class="status-dot"></span>Active Session
                </span>
            </div>
        </section>

        <!-- Coursework Links -->
        <section class="assignments-section">
            <h2>Course Assignments</h2>
            <div class="links-group">
                <a href="prompt.html" class="assignment-btn" id="link-a1">
                    <span>Prompting fundamentals</span>
                    <span class="icon">&rarr;</span>
                </a>
                <a href="gen-prompt.html" class="assignment-btn" id="link-a2">
                    <span>Prompt Builder</span>
                    <span class="icon">&rarr;</span>
                </a>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p>System Time: <span id="live-clock">--:--:--</span> | &copy; CityU Cybersecurity</p>
        </footer>
    </main>

    <!-- Embedded JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Live clock implementation
            function updateClock() {
                const now = new Date();
                const clockElement = document.getElementById('live-clock');
                if (clockElement) {
                    clockElement.textContent = now.toLocaleTimeString();
                }
            }
            updateClock();
            setInterval(updateClock, 1000);

            // Interactive logging for links
            const links = document.querySelectorAll('.assignment-btn');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    console.log(`[Navigation Event] Transferring to: ${link.getAttribute('href')}`);
                });
            });
        });
    </script>
</body>
</html>
